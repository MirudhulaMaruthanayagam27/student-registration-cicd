version: '3.8'

services:
  dev-server:
    image: nginx:alpine
    container_name: student-registration-dev
    ports:
      - "8081:80"
    volumes:
      - ./dist/dev:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: always

  staging-server:
    image: nginx:alpine
    container_name: student-registration-staging
    ports:
      - "8082:80"
    volumes:
      - ./dist/staging:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: always
