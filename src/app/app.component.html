<main class="app-container">
  <div class="form-wrapper">
    <div class="form-header">
      <h1>Student Registration</h1>
      <p>Join our academic community</p>
    </div>
    
    <form (ngSubmit)="submitForm()" #registrationForm="ngForm" class="registration-form">
      <div class="input-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" [(ngModel)]="name" placeholder="John Doe" required>
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="john@example.com" required>
      </div>

      <div class="input-group">
        <label for="department">Department</label>
        <select id="department" name="department" [(ngModel)]="department" required>
          <option value="" disabled selected>Select your department</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Engineering">Engineering</option>
          <option value="Business">Business</option>
          <option value="Arts">Arts</option>
        </select>
      </div>

      <div class="input-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" [(ngModel)]="phone" placeholder="+1 (555) 000-0000" required>
      </div>

      <button type="submit" class="submit-btn" [disabled]="!registrationForm.form.valid">
        <span>Register Student</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
  </div>
</main>
