name: Student Registration CI/CD

on:
  # Runs after code lands on any of these branches.
  push:
    branches:
      - feature/student-registration
      - development
      - main

  # Runs when a Pull Request TARGETS these branches,
  # i.e. BEFORE the merge happens. This is the "check before merging" run.
  pull_request:
    branches:
      - development
      - main

  # Lets you re-run this workflow by hand from the Actions tab,
  # without making a new commit. Useful right after adding secrets.
  workflow_dispatch:
git commit -m "Generate environment files at build time instead of committing them"

jobs:
  build:
    # The temporary Linux machine GitHub gives us. This is called a "runner".
    runs-on: ubuntu-latest

    steps:
      # 1. Copy the repository onto the runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Prove the environment files are NOT in the repository.
      #    This runs BEFORE the build, so the folder should not exist yet.
      - name: Show that no environment file was checked out
        run: |
          echo "Files tracked by Git under src/environments:"
          git ls-files src/environments/
          echo "(nothing listed above = nothing is committed, as intended)"
          echo ""
          echo "Folder on disk right after checkout:"
          ls -l src/environments/ 2>&1 || echo "folder does not exist yet - correct"

      # 3. Install Node.js 20 (the same major version used locally).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 4. Install the exact dependency versions from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # 5. Build. "npm run build" runs generate-env.js first, which CREATES
      #    the environment files using the secrets supplied here.
      - name: Build Angular application
        run: npm run build
        env:
          API_URL: ${{ secrets.API_URL }}
          APP_ENV: ${{ secrets.APP_ENV }}

      # 6. Show the file that generate-env.js just created.
      #    GitHub replaces any secret value with *** in logs,
      #    so seeing *** is PROOF the value came from a secret.
      - name: Show generated environment file
        run: |
          echo "Folder on disk AFTER the build:"
          ls -l src/environments/
          echo ""
          echo "----- src/environments/environment.production.ts -----"
          cat src/environments/environment.production.ts
          echo "------------------------------------------------------"

      # 7. Fail loudly if the secret never reached the build.
      - name: Verify the secret was actually applied
        run: |
          FILE="src/environments/environment.production.ts"

          if [ ! -f "$FILE" ]; then
            echo "::error::generate-env.js did not create the production environment file."
            exit 1
          fi

          if grep -q "localhost:3000" "$FILE"; then
            echo "::error::API_URL is empty, so generate-env.js used its localhost fallback. Is the secret named exactly API_URL?"
            exit 1
          fi

          echo "OK: environment.production.ts was generated from the repository secrets."

      # 8. Prove a real build artifact exists.
      - name: Show build output
        run: ls -R dist/student-registration/browser
