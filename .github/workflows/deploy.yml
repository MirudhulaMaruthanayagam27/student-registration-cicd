name: Student Registration CI/CD

on:
  # Runs after code lands on any of these branches.
  push:
    branches:
      - feature/student-registration
      - development
      - main

  # Runs when a Pull Request TARGETS these branches,
  # i.e. BEFORE the merge happens. This is the "check before merging" run.
  pull_request:
    branches:
      - development
      - main

  # Lets you re-run this workflow by hand from the Actions tab,
  # without making a new commit. Useful right after adding secrets.
  workflow_dispatch:

jobs:
  build:
    # The temporary Linux machine GitHub gives us. This is called a "runner".
    runs-on: ubuntu-latest

    steps:
      # 1. Copy the repository onto the runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js 20 (the same major version used locally).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install the exact dependency versions from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # 4. Build. "npm run build" already runs generate-env.js first,
      #    so the secrets are supplied here as environment variables.
      - name: Build Angular application
        run: npm run build
        env:
          API_URL: ${{ secrets.API_URL }}
          APP_ENV: ${{ secrets.APP_ENV }}

      # 5. Show the file that generate-env.js produced.
      #    GitHub automatically replaces any secret value with *** in logs,
      #    so seeing *** is PROOF the value came from a secret.
      - name: Show generated environment file
        run: |
          echo "----- src/environments/environment.production.ts -----"
          cat src/environments/environment.production.ts
          echo "------------------------------------------------------"

      # 6. Fail loudly if the secret never reached the build.
      - name: Verify the secret was actually applied
        run: |
          FILE=src/environments/environment.production.ts

          if grep -q "example-api.com" "$FILE"; then
            echo "::error::API_URL secret was NOT applied. The committed placeholder is still there."
            exit 1
          fi

          if grep -q "localhost:3000" "$FILE"; then
            echo "::error::API_URL is empty, so generate-env.js fell back to localhost. Is the secret named exactly API_URL?"
            exit 1
          fi

          echo "OK: environment.production.ts was generated from the repository secrets."

      # 7. Prove a real build artifact exists.
      - name: Show build output
        run: ls -R dist/student-registration/browser
