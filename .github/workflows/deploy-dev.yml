name: Deploy to Dev Server

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Log Push/Merge Details
        run: |
          echo "=========================================="
          echo "🚀 DEPLOYMENT TRIGGERED!"
          echo "=========================================="
          echo "Event Type: ${{ github.event_name }}"
          echo "Target Branch: ${{ github.ref_name }}"
          echo "Commit Message: ${{ github.event.head_commit.message }}"
          echo "Committed By: ${{ github.actor }}"
          echo "=========================================="

      # Step 1: Checkout the code from the develop branch
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install Angular dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Create .env.development from GitHub secrets
      - name: Create .env.development from GitHub secret
        run: |
          echo "=========================================="
          echo "🔒 Accessing GitHub Secrets for Dev Environment..."
          echo "=========================================="
          echo "API_BASE_URL=${{ secrets.DEV_API_BASE_URL }}" > .env.development
          echo "✅ .env.development file generated successfully!"

      # Step 4.5: Generate Angular development environment file
      - name: Generate Angular development environment file
        run: npm run generate-env:dev

      # Step 5: Build the Angular app for development
      - name: Build Angular Application (Dev)
        run: npm run build:dev

      # Step 6: Verify Build Output
      - name: Verify Dist Folder
        run: |
          echo "=========================================="
          echo "📂 Verifying Dev Build Output (dist folder)..."
          echo "=========================================="
          ls -la dist/student-registration
          echo "✅ SUCCESS: The dist folder is completely updated for Dev Environment!"

      # Step 6: Deploy to the Dev Server
      # In this fake setup, we copy the build files to the directory mapped to our Docker container
      - name: Deploy to Dev Container
        run: |
          # Ensure target directory exists
          mkdir -p dist/dev
          # Sync the compiled files into the Nginx container's mapped volume
          rsync -av --delete dist/student-registration/ dist/dev/
          
      # Step 7: Restart Nginx (Optional, since Nginx serves files dynamically)
      # If this were a real SSH deployment, you might restart the service here.
      - name: Restart Server
        run: echo "Deployed to Dev! Nginx is serving the new files."
